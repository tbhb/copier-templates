# Copier configuration for template meta-template
# https://copier.readthedocs.io/
---
_min_copier_version: "9.0.0"

_subdirectory: .

_exclude:
  - copier.yaml
  - .git

_jinja_extensions:
  - jinja2.ext.do
  - jinja2.ext.loopcontrols

# Template questions
template_name:
  type: str
  help: Human-readable template name (e.g., "Python Monorepo")

template_slug:
  type: str
  help: Template directory name (e.g., "python-monorepo")
  default: "{{ template_name | lower | replace(' ', '-') | replace('_', '-') }}"

template_description:
  type: str
  help: One-line template description

_tasks:
  - "mv generated-copier.yaml copier.yaml"
