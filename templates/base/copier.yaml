# Copier configuration for base template
# https://copier.readthedocs.io/
---
_min_copier_version: "9.0.0"

_subdirectory: .

_exclude:
  - copier.yaml
  - "*.pyc"
  - __pycache__
  - .git

_jinja_extensions:
  - jinja2.ext.do
  - jinja2.ext.loopcontrols

# Template questions
project_name:
  type: str
  help: Human-readable project name

project_slug:
  type: str
  help: Repo/project name (hyphenated)
  default: "{{ project_name | lower | replace(' ', '-') | replace('_', '-') }}"

project_description:
  type: str
  help: One-line project description

_tasks:
  - "git init"
  - "vale sync"
  - "prek install"
  - "git add ."
