name: Test Templates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-template:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template:
          - python-library
          - python-tool

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.13

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install just
        uses: extractions/setup-just@v3

      - name: Install Copier
        run: uv tool install copier

      - name: Generate project from template
        run: |
          copier copy --defaults --trust \
            --data project_name="testproject" \
            --data project_slug="testproject" \
            --data project_module="testproject" \
            --data project_description="A test project for template validation" \
            --data keywords="test,template,validation" \
            templates/${{ matrix.template }} /tmp/test-project

      - name: Run lints
        working-directory: /tmp/test-project
        run: just lint

      - name: Run tests
        working-directory: /tmp/test-project
        run: just test

      - name: Build docs
        working-directory: /tmp/test-project
        env:
          CI: "false"
        run: just build-docs
